document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

10px;height:10px;background:var(--link);border-radius:2px;vertical-align:-1px\"><\u002Fspan> link #0d7442<\u002Fspan>\n<span>radius 16 / field 12<\u002Fspan>\n<span>font system<\u002Fspan>\n<span>salah Fajr · Dhuhr · Asr · Maghrib · Isha<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:32px;flex-wrap:wrap;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;font-size:13.5px;line-height:1.6;max-width:1180px\">\n<div style=\"flex:1;min-width:300px\"><div style=\"font-weight:600;margin-bottom:6px\">What changed from v1 — read this first<\u002Fdiv><div style=\"color:var(--muted);text-wrap:pretty\">The target moved from <b style=\"color:var(--foreground);font-weight:500\">HeroUI Native<\u002Fb> to <b style=\"color:var(--foreground);font-weight:500\">HeroUI v3 for React<\u002Fb>, so DESIGN.md §3–§4 no longer describe the available set. Three things v1 had to hand-build now ship in the library: <b style=\"color:var(--foreground);font-weight:500\">Table<\u002Fb>, <b style=\"color:var(--foreground);font-weight:500\">TimeField<\u002Fb> and <b style=\"color:var(--foreground);font-weight:500\">DatePicker<\u002Fb>. Every annotation below uses real v3 export names and the compound <code style=\"font-family:ui-monospace,Menlo,monospace\">Card.Header<\u002Fcode> / <code style=\"font-family:ui-monospace,Menlo,monospace\">ListBox.Item<\u002Fcode> dot notation.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:300px\"><div style=\"font-weight:600;margin-bottom:6px\">Brand now comes from your screens<\u002Fdiv><div style=\"color:var(--muted);text-wrap:pretty\">Your mockups are green, so green it is — the original “avoid green” note in the brief is overridden by your own designs. Name is <b style=\"color:var(--foreground);font-weight:500\">MasjidLove<\u002Fb>. Deep green is the accent, your dark teal maps to HeroUI’s <code style=\"font-family:ui-monospace,Menlo,monospace\">variant=\"secondary\"<\u002Fcode>, and <code style=\"font-family:ui-monospace,Menlo,monospace\">--link<\u002Fcode> is a lighter, brighter green (<code style=\"font-family:ui-monospace,Menlo,monospace\">#0d7442<\u002Fcode>, 5.8:1 on white) rather than the blue in your mockups — it reads as a link against body text while staying inside the palette. Because the accent is green, <b style=\"color:var(--foreground);font-weight:500\">there is no separate success colour<\u002Fb> — a green “confirmed” chip next to a green accent carries no information. Confirmed states use <code style=\"font-family:ui-monospace,Menlo,monospace\">--accent-soft<\u002Fcode>.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:300px\"><div style=\"font-weight:600;margin-bottom:6px\">Emphasis moved to events<\u002Fdiv><div style=\"color:var(--muted);text-wrap:pretty\">Jamaat times are now a single quiet line at the top of Home with a link to the full week; the screen’s weight sits on event cards with real imagery. The 96px countdown from v1 is gone. Times remain fully available — one tap away, and still the whole of screens 15 and 19 — they just stopped being the thing you see first.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ ONBOARDING ═══════════ -->\n<section data-screen-label=\"Onboarding\" style=\"padding:32px 48px 48px;border-top:1px solid var(--border)\">\n<div style=\"font-size:22px;font-weight:600;margin-bottom:6px\">Onboarding — 11 screens<\u002Fdiv>\n<div style=\"font-size:14px;color:var(--muted);max-width:760px;line-height:1.55;margin-bottom:32px;text-wrap:pretty\">Your four screens re-imagined in HeroUI v3, plus four that the flow needs to actually work: email verification, masjid picking, notification choice, and a close. No carousel — every screen either collects something or grants something.<\u002Fdiv>\n<div style=\"display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start\">\n\n<!-- 01 WELCOME -->\n<div style=\"width:393px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;align-items:baseline;ga items:flex-end;font-size:13px;font-weight:600;flex:none\"><span>9:41<\u002Fspan><\u002Fdiv>\n  <div style=\"flex:1;padding:4px 16px 0;display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:44px;height:44px;border-radius:22px;background:var(--default);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:none\">YA<\u002Fdiv><div style=\"flex:1;display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;color:var(--muted)\">Asalamu Alaykum<\u002Fspan><span style=\"font-size:19px;font-weight:600\">Yusuf<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-start;gap:10px;background:var(--warning-soft);border-radius:16px;padding:13px 14px\">\n      <span style=\"color:var(--warning-soft-foreground);display:flex;flex:none;margin-top:1px\"><svg width=\"20\" height=\"20\"><use href=\"#i-off\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13.5px;color:var(--warning-soft-foreground);line-height:1.45\">You’re offline. This was saved on Mon 31 Aug and may have changed since.<\u002Fspan>\n        <span style=\"font-size:13.5px;font-weight:700;color:var(--warning-soft-foreground)\">Try again<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:12px 14px;display:flex;align-items:center;gap:12px;opacity:.7\">\n      <span style=\"color:var(--muted);display:flex;flex:none\"><svg width=\"20\" height=\"20\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:15.5px\"><span style=\"font-weight:600\">Dhuhr 13:15<\u002Fspan><span style=\"color:var(--muted)\"> · saved<\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:var(--muted)\">Countdown paused while offline<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:19px;font-weight:600;letter-spacing:-.01em\">This week near you<\u002Fdiv>\n      <div style=\"border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--background);opacity:.7\">\n        <div style=\"height:130px;background:var(--default);display:flex;align-items:center;justify-content:center;color:var(--muted)\"><svg width=\"26\" height=\"26\"><use href=\"#i-off\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:14px;display:flex;flex-direction:column;gap:7px\">\n          <span style=\"font-size:12.5px;font-weight:600;background:var(--default);color:var(--default-foreground);padding:4px 9px;border-radius:8px;align-self:flex-start\">Thu 3 Sep · 19:45<\u002Fspan>\n          <div style=\"font-size:16.5px;font-weight:600\">Tafsīr of Sūrah Yūsuf<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--muted)\">Masjidul Quds · saved copy<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--muted);line-height:1.5\">Images and RSVP need a connection. Everything else works offline.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:none;border-top:1px solid var(--separator);display:flex;padding:8px 0 34px\">\n    <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--accent)\"><svg width=\"24\" height=\"24\"><use href=\"#i-home\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px;font-weight:600\">Home<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)\"><svg width=\"24\" height=\"24\"><use href=\"#i-map\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px\">Explore<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)\"><svg width=\"24\" height=\"24\"><use href=\"#i-cal\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px\">Events<\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)\"><svg width=\"24\" height=\"24\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px\">Profile<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;width:393px;line-height:1.6\">21c — offline / stale. <code>Alert variant=\"warning\"<\u002Fcode> + retry <code>Link<\u002Fcode>. Content still shows, marked “saved” and at 0.7 — a stale time is more use than no time. Chips drop to <code>--default<\u002Fcode> so nothing tinted looks live.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"width:393px;height:852px;background:var(--background);border:1px solid var(--border);border-radius:32px;box-shadow:var(--surface-shadow);overflow:hidden;position:relative\">\n  <div style=\"position:absolute;inset:0;background:var(--snow)\"><div style=\"position:absolute;left:0;right:0;top:190px;height:6px;background:var(--default)\"><\u002Fdiv><div style=\"position:absolute;top:0;bottom:0;left:180px;width:7px;background:var(--default)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"position:absolute;left:0;right:0;top:0;height:50px;padding:0 26px 8px;display:flex;align-items:flex-end;font-size:13px;font-weight:600\"><span>9:41<\u002Fspan><\u002Fdiv>\n  <div style=\"position:absolute;left:16px;right:16px;top:58px;height:50px;background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:var(--field-shadow);display:flex;align-items:center;gap:10px;padding:0 16px\"><span style=\"color:var(--muted);display:flex\"><svg width=\"20\" height=\"20\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><\u002Fspan><span style=\"font-size:16px;color:var(--muted)\">Search masjid or area<\u002Fspan><\u002Fdiv>\n  <div style=\"position:absolute;left:16px;right:16px;top:120px;background:var(--danger-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"color:var(--danger-soft-foreground);display:flex;flex:none;margin-top:1px\"><svg width=\"20\" height=\"20\"><use href=\"#i-loc\"><\u002Fuse><\u002Fsvg><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:16px;font-weight:700;color:var(--danger-soft-foreground)\">Location is off<\u002Fspan><span style=\"font-size:13.5px;color:var(--danger-soft-foreground);line-height:1.45\">We can’t sort by walking distance without it — but you can still browse by area.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px\"><div style=\"flex:1;height:46px;border-radius:12px;background:var(--danger);color:var(--danger-foreground);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500\">Open Settings<\u002Fdiv><div style=\"flex:1;height:46px;border-radius:12px;background:var(--background);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500\">Browse by area<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:0;right:0;bottom:0;height:262px;background:var(--overlay);border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:var(--surface-shadow);display:flex;flex-direction:column\">\n    <div style=\"padding:10px 0 6px;display:flex;justify-content:center\"><div style=\"width:38px;height:4px;border-radius:2px;background:var(--default)\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:16px;font-weight:600\">Browse by area<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span style=\"font-size:14px;font-weight:500;background:var(--default);padding:9px 13px;border-radius:12px\">Gatesville<\u002Fspan><span style=\"font-size:14px;font-weight:500;background:var(--default);padding:9px 13px;border-radius:12px\">Rylands<\u002Fspan><span style=\"font-size:14px;font-weight:500;background:var(--default);padding:9px 13px;border-radius:12px\">Athlone<\u002Fspan><span style=\"font-size:14px;font-weight:500;background:var(--default);padding:9px 13px;border-radius:12px\">Bo-Kaap<\u002Fspan><span style=\"font-size:14px;font-weight:500;background:var(--default);padding:9px 13px;border-radius:12px\">Mowbray<\u002Fspan><span style=\"font-size:14px;font-weight:500;background:var(--default);padding:9px 13px;border-radius:12px\">Salt River<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"flex:none;border-top:1px solid var(--separator);display:flex;padding:8px 0 34px\">\n      <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)\"><svg width=\"24\" height=\"24\"><use href=\"#i-home\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px\">Home<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--accent)\"><svg width=\"24\" height=\"24\"><use href=\"#i-map\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px;font-weight:600\">Explore<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)\"><svg width=\"24\" height=\"24\"><use href=\"#i-cal\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px\">Events<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)\"><svg width=\"24\" height=\"24\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11.5px\">Profile<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;width:393px;line-height:1.6\">21d — Explore, location denied. <code>Alert variant=\"danger\"<\u002Fcode> with two 46pt actions; the sheet degrades to an area <code>ToggleButtonGroup<\u002Fcode>, so the screen still does its job.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:48px;flex-wrap:wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.65;border-top:1px solid var(--border);padding-top:24px\">\n<div style=\"max-width:400px\"><div style=\"font-weight:600;letter-spacing:.06em;margin-bottom:4px\">COMPONENTS<\u002Fdiv><div style=\"color:var(--muted)\">21a <code>Skeleton<\u002Fcode> · 21b <code>Typography<\u002Fcode> + <code>Button<\u002Fcode> primary + <code>Button variant=\"ghost\"<\u002Fcode> · 21c <code>Alert variant=\"warning\"<\u002Fcode> + <code>Link<\u002Fcode> · 21d <code>Alert variant=\"danger\"<\u002Fcode> + two <code>Button<\u002Fcode>s + <code>ToggleButtonGroup<\u002Fcode><\u002Fdiv><\u002Fdiv>\n<div style=\"max-width:400px\"><div style=\"font-weight:600;letter-spacing:.06em;margin-bottom:4px\">TOKENS<\u002Fdiv><div style=\"color:var(--muted)\">Skeletons are flat <code>--default<\u002Fcode> with a slow opacity pulse — no shimmer sweep<br><code>--danger<\u002Fcode> only where the user must act (21d); <code>--warning<\u002Fcode> where they merely need to know (21c)<br>stale content is 0.7 opacity <b>plus<\u002Fb> the word “saved” <b>plus<\u002Fb> de-tinted chips — never opacity alone<\u002Fdiv><\u002Fdiv>\n<div style=\"max-width:400px\"><div style=\"font-weight:600;letter-spacing:.06em;margin-bottom:4px\">GAPS<\u002Fdiv><div style=\"color:var(--muted)\">none beyond the tab bar and the map, already recorded on screens 12 and 13.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Handover\" style=\"padding:32px 48px 96px;border-top:1px solid var(--border);display:flex;gap:40px;flex-wrap:wrap;background:var(--surface)\">\n<div style=\"flex:1;min-width:300px;max-width:440px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:18px;font-weight:600\">Before you build<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.65;color:var(--muted);text-wrap:pretty\">HeroUI v3 is in <b style=\"color:var(--foreground);font-weight:500\">beta<\u002Fb> — pin exact versions and re-check the changelog before upgrading, because component APIs are still moving. Set the brand green, the 16px radius and the system font stack once in the theme; nothing in this spec should be re-declared per screen. Every component named here is a real v3 React export — <code style=\"font-family:ui-monospace,Menlo,monospace;color:var(--foreground)\">Table<\u002Fcode>, <code style=\"font-family:ui-monospace,Menlo,monospace;color:var(--foreground)\">TimeField<\u002Fcode> and <code style=\"font-family:ui-monospace,Menlo,monospace;color:var(--foreground)\">DatePicker<\u002Fcode> are the three that were hand-built workarounds in v1.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:300px;max-width:440px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:18px;font-weight:600\">The four GAPS, in full<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.65;color:var(--muted);text-wrap:pretty\">Only four things in this app are not HeroUI: the <b style=\"color:var(--foreground);font-weight:500\">bottom tab bar<\u002Fb> (router chrome), the <b style=\"color:var(--foreground);font-weight:500\">map and its markers<\u002Fb> (Mapbox or Google), the <b style=\"color:var(--foreground);font-weight:500\">avatar cluster<\u002Fb> on event detail, and the <b style=\"color:var(--foreground);font-weight:500\">photography<\u002Fb> itself. Everything else composes from the library. If you find yourself building a fifth custom component, check the v3 docs first — it probably exists.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:300px;max-width:440px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:18px;font-weight:600\">What still needs deciding<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.65;color:var(--muted);text-wrap:pretty\">Three open questions, all content rather than code. Where do <b style=\"color:var(--foreground);font-weight:500\">masjid photos<\u002Fb> come from, and who approves them? Should admins be able to <b style=\"color:var(--foreground);font-weight:500\">see the RSVP list by name<\u002Fb>, or only the count? And is <b style=\"color:var(--foreground);font-weight:500\">dark mode<\u002Fb> in scope for v1 — the tokens are structured for it, but none of these screens have been drawn in it yet.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
